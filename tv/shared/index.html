<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Orbis</title>
  <link rel="stylesheet" href="shell.css">
</head>
<body>
  <main id="setup" class="scene" hidden>
    <section class="card">
      <img class="wordmark" src="wordmark.png" alt="Orbis">
      <h1>Connect your TV</h1>
      <p>Enter the address of your Orbis server.</p>
      <form id="server-form">
        <label for="address">Orbis Server Address</label>
        <input id="address" name="address" type="text" inputmode="url" autocomplete="url" placeholder="http://your-server:3000" required>
        <p id="form-error" class="error" role="alert"></p>
        <button type="submit">Connect</button>
      </form>
      <small>TV installation ID: <code id="installation-id"></code></small>
    </section>
  </main>
  <main id="checking" class="scene" hidden><section class="card compact"><img class="wordmark" src="wordmark.png" alt="Orbis"><p role="status">Connecting to your server…</p></section></main>
  <main id="offline" class="scene" hidden>
    <section class="card compact">
      <img class="wordmark" src="wordmark.png" alt="Orbis">
      <h1>Server unavailable</h1>
      <p>Configured server: <strong id="configured"></strong></p>
      <div class="actions"><button id="retry">Retry</button><button id="change-server" class="secondary">Change Server</button></div>
    </section>
  </main>
  <script src="shell.js"></script>
  <script>OrbisTvShell.start(document, localStorage, window.ORBIS_TV_PLATFORM || 'tizen');</script>
</body>
</html>
