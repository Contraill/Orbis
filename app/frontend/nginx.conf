map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    # Capability URLs and room IDs must not enter access logs.
    access_log off;
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Upstream errors otherwise log the complete bearer-capability URI.
        # Use sanitized application/admin diagnostics for API failures.
        error_log /dev/null;
        resolver 127.0.0.11 valid=10s ipv6=off;

        set $backend http://backend:8000;
        proxy_pass $backend$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 60s;
        # Preserve the browser-facing port for the backend's strict WS Origin check.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
